name: Previas de video

# Converte os videos do Drive em aprovacao para uma previa leve (1080p H.264) e envia para
# public_html/previas/<id>.mp4. O original no Drive nao e alterado.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/previas-video.yml']

concurrency:
  group: previas-video
  cancel-in-progress: false

jobs:
  previas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Converter e enviar previas que faltam
        env:
          SUPA_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -u
          falhas=0
          SITE=https://cerebro.agenciastartip.com.br
          ids=$(curl -sf -X POST "$SUPA_URL/rest/v1/rpc/previas_pendentes" \
            -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY" \
            -H "Content-Type: application/json" -d '{}' | jq -r '.[].drive_id')
          dir="${FTP_DIR%/}/"; dir="${dir#/}"
          for id in $ids; do
            code=$(curl -s -o /dev/null -r 0-99 -w '%{http_code}' "$SITE/previas/$id.mp4")
            if [ "$code" = "206" ]; then continue; fi
            echo "::group::Previa de $id"
            info=$(curl -sSL -m 1500 -o orig.mp4 -w '%{http_code} %{content_type} %{size_download}' "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t") || info="erro-curl"
            echo "Download: $info"
            if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 orig.mp4 2>/dev/null | grep -q .; then
              echo "::error::Nao baixou como video id=$id download=[$info]"; rm -f orig.mp4; falhas=$((falhas+1)); echo "::endgroup::"; continue
            fi
            ffmpeg -v error -y -i orig.mp4 -vf "scale='min(1080,iw)':-2,fps=30" \
              -c:v libx264 -profile:v high -pix_fmt yuv420p -crf 23 -maxrate 6M -bufsize 12M -preset medium \
              -c:a aac -b:a 128k -movflags +faststart previa.mp4 || { echo "::error::Falha ao converter id=$id"; falhas=$((falhas+1)); echo "::endgroup::"; continue; }
            if erro=$(curl -fsS --ssl --ftp-create-dirs -k -T previa.mp4                 "ftp://$FTP_SERVER/${dir}previas/$id.mp4.part" --user "$FTP_USERNAME:$FTP_PASSWORD"                 -Q "+RNFR ${dir}previas/$id.mp4.part" -Q "+RNTO ${dir}previas/$id.mp4" 2>&1); then
              echo "Enviada: $id ($(du -h previa.mp4 | cut -f1))"
            else
              echo "::error::Falha no envio FTP id=$id dir=[$dir] erro=[$erro]"; falhas=$((falhas+1))
            fi
            rm -f orig.mp4 previa.mp4
            echo "::endgroup::"
          done
          [ "$falhas" -eq 0 ] || { echo "$falhas falha(s)"; exit 1; }
